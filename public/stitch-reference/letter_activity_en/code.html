<script>
        // Simple confetti effect for interaction
        function createConfetti() {
            const colors = ['#fdd029', '#47c1ff', '#ff9d78'];
            for(let i=0; i<30; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti', 'rounded-full');
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = -10 + 'px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.opacity = 1;
                document.body.appendChild(conf);
                
                const fallDuration = Math.random() * 2 + 1;
                conf.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random()*360}deg)`, opacity: 0 }
                ], {
                    duration: fallDuration * 1000,
                    easing: 'linear'
                }).onfinish = () => conf.remove();
            }
        }

        // Add interaction to buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                if(btn.textContent.includes('Your turn!')) {
                    createConfetti();
                }
            });
        });
    </script>
