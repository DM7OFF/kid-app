<style>
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fdd029;
            opacity: 0;
        }
        
        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .star-burst {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes starPop {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .wiggle {
            animation: wiggle 2s linear infinite;
        }

        @keyframes wiggle {
            0%, 7% { transform: rotateZ(0); }
            15% { transform: rotateZ(-15deg); }
            20% { transform: rotateZ(10deg); }
            25% { transform: rotateZ(-10deg); }
            30% { transform: rotateZ(6deg); }
            35% { transform: rotateZ(-4deg); }
            40%, 100% { transform: rotateZ(0); }
        }
        
        .bouncy-button {
            box-shadow: 0 8px 0 theme('colors.tertiary');
            transition: all 0.1s ease-in-out;
        }
        .bouncy-button:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 theme('colors.tertiary');
        }

<script>
        // Confetti Effect
        const colors = ['#fdd029', '#47c1ff', '#ff9d78', '#00658d'];
        const container = document.getElementById('confetti-container');

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Randomize size and shape
            if(Math.random() > 0.5) {
                confetti.style.borderRadius = '50%';
            }
            
            const size = Math.random() * 15 + 5;
            confetti.style.width = size + 'px';
            confetti.style.height = size + 'px';

            const duration = Math.random() * 3 + 2;
            confetti.style.animation = `confettiFall ${duration}s linear forwards`;
            
            container.appendChild(confetti);

            setTimeout(() => {
                confetti.remove();
            }, duration * 1000);
        }

        // Initial burst
        for(let i=0; i<100; i++) {
            setTimeout(createConfetti, i * 20);
        }

        // Continuous light fall
        setInterval(() => {
            createConfetti();
        }, 150);

        // Star Pop Effect on Click
        document.body.addEventListener('click', (e) => {
            const star = document.createElement('span');
            star.classList.add('material-symbols-outlined', 'star-burst', 'text-secondary-container');
            star.textContent = 'star';
            star.style.fontVariationSettings = "'FILL' 1";
            star.style.fontSize = '48px';
            star.style.left = `${e.clientX - 24}px`;
            star.style.top = `${e.clientY - 24}px`;
            star.style.animation = 'starPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';
            
            document.body.appendChild(star);
            
            setTimeout(() => {
                star.remove();
            }, 800);
        });
    </script>
