<style>

<body class="bg-secondary-fixed text-on-background font-body-xl min-h-screen flex flex-col pb-24 md:pb-0 overflow-x-hidden selection:bg-primary selection:text-on-primary">
<!-- Top Navigation (Visible on md+) -->

<div class="flex items-center gap-4">

</div>
<div class="flex gap-4">
<button aria-label="settings" class="flex items-center justify-center p-3 text-on-surface-variant hover:text-primary hover:bg-surface-container-high rounded-full hover:scale-105 transition-transform">

<span class="material-symbols-outlined" data-icon="stars">stars</span>
</button>
</div>
</nav>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-gutter w-full max-w-screen-xl mx-auto gap-stack-gap">
<!-- Progress Bar -->
<div class="w-full max-w-md bg-surface-container rounded-full h-6 mb-4 shadow-inner relative overflow-hidden">
<div class="bg-gradient-to-r from-primary to-primary-container h-full rounded-full w-1/4 relative shadow-sm">

</div>
</div>
<!-- Activity Header -->
<div class="text-center mb-8 bounce-in" style="animation-delay: 0.1s;">
<h1 class="font-display-hero text-[80px] md:text-[120px] text-primary drop-shadow-md leading-none">1</h1>
<h2 class="font-headline-lg text-primary-fixed-variant mt-2">One!</h2>
</div>
<!-- Central Interactive Area -->
<div class="flex flex-col md:flex-row items-center justify-center gap-stack-gap w-full">
<!-- Character Area -->
<div class="w-48 md:w-64 relative bounce-in" style="animation-delay: 0.3s;">
<img alt="Singer character encouraging the child" class="w-full h-auto drop-shadow-xl wiggle-animation" src="https://lh3.googleusercontent.com/aida/AEtjO1Xi_MHV-nkpi0wfXvGx4pFnz-DVsKq4YP-mICIRLCD5WGAUlB6ixaFr8_jqH0woAS7KYZ3B2pSnqrBUeZmC2XNpvsfqdpwGYwOLe21ESZSbtVYuiR5t348Ji67eH7aEGml3bdPecc0LDNg8cWWrN9GMZhbAjBHvnqFfiJzkezy5TWq9-7rmVyrNMIo6q5bpriUMgWiiYLFXLMR2ePnUjMgUCKMHC0HDNAJsi8BcFiwH94ZfIJ02Nec0Kg"/>
<!-- Speech Bubble -->
<div class="absolute -top-12 -right-8 md:-right-16 bg-surface p-4 rounded-xl shadow-lg border-2 border-primary-container z-10 before:content-[''] before:absolute before:bottom-[-10px] before:left-8 before:border-l-[10px] before:border-l-transparent before:border-r-[10px] before:border-r-transparent before:border-t-[10px] before:border-t-surface">
<p class="font-label-bold text-on-surface text-center">How many do you see?</p>
</div>
</div>
<!-- Subject Area -->

</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant p-unit border-b-4 border-transparent hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined text-[32px]" data-icon="face">face</span>
<span class="font-label-bold text-sm mt-1">Profil</span>

<script>
        // Simple interactive feedback for buttons
        const choiceButtons = document.querySelectorAll('.grid button');
        choiceButtons.forEach(button => {
            button.addEventListener('click', function() {
                if(this.textContent.trim() === '1') {
                    // Success state
                    this.classList.replace('bg-primary', 'bg-secondary-container');
                    this.classList.replace('border-on-primary-fixed-variant', 'border-secondary');
                    this.classList.replace('text-on-primary', 'text-on-secondary-container');
                    
                    // Simple confetti effect (visual cue only for this demo)
                    const container = this.parentElement;
                    const sparkle = document.createElement('span');
                    sparkle.classList.add('material-symbols-outlined', 'absolute', 'text-secondary', 'text-4xl', 'animate-ping');
                    sparkle.textContent = 'stars';
                    sparkle.style.left = '50%';
                    sparkle.style.top = '-20px';
                    this.style.position = 'relative';
                    this.appendChild(sparkle);
                    
                    setTimeout(() => sparkle.remove(), 1000);
                } else {
                    // "Try again" visual cue
                    this.classList.add('animate-pulse', 'bg-surface-variant');
                    setTimeout(() => {
                        this.classList.remove('animate-pulse', 'bg-surface-variant');
                    }, 500);
                }
            });
        });
    </script>
