<!-- Overlay Confetti Effect (Atmospheric JS) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple visual effect to reinforce gamified feel without full particle system
            const sparkleElements = document.querySelectorAll('.badge-float, .badge-float-delayed, .badge-float-delayed-2');
            
            sparkleElements.forEach(el => {
                el.addEventListener('click', function() {
                    this.classList.remove('badge-float', 'badge-float-delayed', 'badge-float-delayed-2');
                    this.style.transform = 'scale(1.2) rotate(5deg)';
                    setTimeout(() => {
                        this.style.transform = '';
                        this.classList.add('badge-float'); // reset animation
                    }, 300);
                });
            });
        });
    </script>
